# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_loader_version=0.19.3
fabric_api_version=0.154.3+26.3

# Loom resolves Minecraft by its launcher id (minecraft_version, e.g. 26.3-snapshot-3), but Fabric
# Loader normalizes snapshots to a semver (26.3-snapshot-3 -> 26.3-alpha.3) at runtime, so the
# fabric.mod.json "depends.minecraft" predicate must be written in that normalized space.
fabric_minecraft_dependency=>=26.3-alpha.3

optional_dependencies=fabric-api
additional_modloaders=quilt
